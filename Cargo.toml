[workspace]
members = [".", "demos/neon_rush", "demos/mahjong_wars", "demos/cozy_golf"]
resolver = "2"

[package]
name = "dullahan"
version = "0.1.0"
edition = "2024"

[dependencies]
# Intentionally empty: zero external Cargo dependencies.

[lib]
name = "dullahan"
path = "src/lib.rs"

[[bin]]
name = "dctl"
path = "src/bin/dctl.rs"
